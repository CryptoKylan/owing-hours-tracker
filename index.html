<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Owing">
<title>Owing</title>
<style>
  :root {
    --bg: #f3efe6;
    --ink: #1c1917;
    --muted: #6f675e;
    --line: #e4dccd;
    --card: #fffdf8;
    --green: #0f6e56;
    --green-soft: #e7f5ef;
    --amber: #9a3412;
    --amber-soft: #fff1e6;
    --danger: #9f1239;
    --shadow: 0 10px 30px rgba(28, 25, 23, 0.08);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(18px + var(--safe-top)) 16px calc(28px + var(--safe-bot));
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 2px;
    color: var(--muted);
    font-weight: 700;
  }
  .rate-line { margin: 0; color: var(--muted); font-size: 14px; }
  .cloud-status { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
  .cloud-status.ok { color: var(--green); }
  .cloud-status.bad { color: var(--danger); }
  .icon-btn {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    font-size: 18px;
  }
  .hero {
    background: var(--ink);
    color: #faf7f2;
    border-radius: 22px;
    padding: 22px 20px 18px;
    box-shadow: var(--shadow);
  }
  .hero .label {
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    opacity: 0.72;
    margin: 0 0 6px;
  }
  .hero .amount {
    font-size: 44px;
    line-height: 1;
    font-weight: 750;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
  .hero .sub {
    margin: 10px 0 0;
    color: #d6d0c6;
    font-size: 14px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 12px 0 16px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 14px;
  }
  .stat span { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat strong { display: block; margin-top: 4px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions button, .primary, .ghost, .danger {
    border: 0;
    border-radius: 14px;
    padding: 14px 12px;
    font-weight: 700;
  }
  .actions .hours { background: var(--green); color: white; }
  .actions .pay { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .actions .expense { grid-column: 1 / -1; background: var(--amber-soft); color: var(--amber); border: 1px solid #fed7aa; }
  .actions .mail { grid-column: 1 / -1; background: var(--ink); color: white; }
  pre.report {
    white-space: pre-wrap;
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.45;
    max-height: 220px;
    overflow: auto;
    margin: 12px 0 0;
  }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--ink); font-size: 14px; }
  .check input { width: auto; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 22px 0 10px;
  }
  .section-head h2 { margin: 0; font-size: 16px; }
  .filters { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .filters button {
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 999px;
    padding: 6px 10px;
    color: var(--muted);
    font-size: 13px;
  }
  .filters button.on { background: var(--ink); color: white; border-color: var(--ink); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
  }
  .row .when { font-weight: 700; }
  .row .meta, .row .note { color: var(--muted); font-size: 13px; }
  .row .note { grid-column: 1 / -1; }
  .row .money { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
  .row .money.plus { color: var(--green); }
  .row .money.minus { color: var(--amber); }
  .row .money.expense { color: var(--danger); }
  .row .bal { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .empty {
    border: 1px dashed var(--line);
    border-radius: 16px;
    padding: 22px 16px;
    color: var(--muted);
    text-align: center;
  }
  .sheet-back {
    position: fixed;
    inset: 0;
    background: rgba(28, 25, 23, 0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 5;
  }
  .sheet {
    width: min(480px, 100%);
    background: var(--bg);
    border-radius: 22px 22px 0 0;
    padding: 14px 16px calc(18px + var(--safe-bot));
    max-height: 92dvh;
    overflow: auto;
  }
  .grab {
    width: 42px;
    height: 4px;
    border-radius: 99px;
    background: #d3cbbf;
    margin: 0 auto 12px;
  }
  .sheet h3 { margin: 0 0 12px; font-size: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; font-weight: 650; }
  input, textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: white;
    border-radius: 12px;
    padding: 12px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chips button {
    border: 1px solid var(--line);
    background: white;
    border-radius: 999px;
    padding: 8px 12px;
  }
  .chips button.on { background: var(--ink); color: white; border-color: var(--ink); }
  .preview {
    margin-top: 12px;
    background: var(--green-soft);
    color: var(--green);
    border-radius: 12px;
    padding: 12px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .primary { background: var(--ink); color: white; }
  .ghost { background: white; border: 1px solid var(--line); }
  .danger { background: #fff1f2; color: var(--danger); border: 1px solid #fecdd3; }
  .full { grid-column: 1 / -1; }
  .fine { color: var(--muted); font-size: 13px; line-height: 1.4; margin: 8px 0 0; }
  .receipt-preview { display: block; width: 100%; max-height: 260px; object-fit: contain; border: 1px solid var(--line); border-radius: 12px; background: white; margin-top: 10px; }
  .receipt-link { display: block; text-align: center; text-decoration: none; margin-top: 10px; }
  body.read-only .actions, body.read-only #settingsBtn { display: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Owing</h1>
      <p class="rate-line" id="rateLine">$35.00/hr</p>
      <p class="cloud-status" id="cloudStatus">Connecting to cloud…</p>
    </div>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">⚙</button>
  </header>
  <section class="hero">
    <p class="label" id="owingLabel">Still owed to you</p>
    <p class="amount" id="owingAmount">$0.00</p>
    <p class="sub" id="owingSub">No hours logged yet</p>
  </section>
  <div class="stats">
    <div class="stat"><span>Earned</span><strong id="earnedStat">$0.00</strong></div>
    <div class="stat"><span>Expenses</span><strong id="expenseStat">$0.00</strong></div>
    <div class="stat"><span>Paid</span><strong id="paidStat">$0.00</strong></div>
  </div>
  <div class="actions">
    <button class="hours" id="addHours" type="button">Log hours</button>
    <button class="pay" id="addPay" type="button">Log payment</button>
    <button class="expense" id="addExpense" type="button">Log job expense + receipt</button>
    <button class="mail" id="emailReport" type="button">Email or text hours</button>
  </div>
  <div class="section-head">
    <h2>Activity</h2>
    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="on">All</button>
      <button type="button" data-filter="hours">Hours</button>
      <button type="button" data-filter="expense">Expenses</button>
      <button type="button" data-filter="payment">Payments</button>
    </div>
  </div>
  <div class="list" id="list"></div>
</div>
<div id="sheetHost"></div>
<script>
const KEY = "owing-ledger-v1";
const DEFAULT_RATE = 35;
const CLOUD_API = "https://temp.trustedeveryday.com/owing-cloud";
const CLOUD_EDITOR_KEY = "owing-cloud-editor-v1";
const CLOUD_VIEWER_KEY = "owing-cloud-viewer-v1";
const cloudParams = new URLSearchParams(location.hash.slice(1));
const viewerTokenFromLink = cloudParams.get("view") || "";
const editorTokenFromLink = cloudParams.get("edit") || "";
const viewerTokenFromEditorLink = cloudParams.get("share") || "";
const isReadOnly = Boolean(viewerTokenFromLink);
let editorToken = editorTokenFromLink || localStorage.getItem(CLOUD_EDITOR_KEY) || "";
let viewerToken = viewerTokenFromEditorLink || localStorage.getItem(CLOUD_VIEWER_KEY) || "";
let cloudReady = false;
let cloudTimer = 0;
let cloudReceipts = new Map();
const reportFrom = cloudParams.get("from") || "";
const reportTo = cloudParams.get("to") || "";
const reportIncludeDetails = cloudParams.get("details") !== "0";

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw || !Array.isArray(raw.entries)) return blankState();
    return {
      rate: Number(raw.rate) > 0 ? Number(raw.rate) : DEFAULT_RATE,
      bossEmail: String(raw.bossEmail || "").trim(),
      workerName: String(raw.workerName || "").trim(),
      entries: raw.entries.filter(e => e && (e.type === "hours" || e.type === "payment" || e.type === "expense") && e.date)
    };
  } catch {
    return blankState();
  }
}
function blankState() {
  return { rate: DEFAULT_RATE, entries: [], bossEmail: "", workerName: "" };
}
function save(state) {
  localStorage.setItem(KEY, JSON.stringify(state));
  queueCloudSync();
}
const RECEIPT_DB = "owing-receipts-v1";
let receiptDbPromise;
function receiptDb() {
  if (!receiptDbPromise) receiptDbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(RECEIPT_DB, 1);
    request.onupgradeneeded = () => request.result.createObjectStore("receipts", { keyPath: "id" });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return receiptDbPromise;
}
async function receiptRequest(mode, action) {
  const db = await receiptDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("receipts", mode);
    const store = tx.objectStore("receipts");
    const request = action(store);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function receiptGet(id) { return receiptRequest("readonly", store => store.get(id)); }
function receiptPut(id, blob, name) { return receiptRequest("readwrite", store => store.put({ id, blob, name: name || "receipt.jpg", updatedAt: Date.now() })); }
function receiptDelete(id) { return receiptRequest("readwrite", store => store.delete(id)); }
function receiptAll() { return receiptRequest("readonly", store => store.getAll()); }
function receiptClear() { return receiptRequest("readwrite", store => store.clear()); }
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
function dataUrlToBlob(dataUrl) {
  const parts = String(dataUrl).split(",");
  const mime = (parts[0].match(/data:([^;]+)/) || [])[1] || "image/jpeg";
  const binary = atob(parts[1] || "");
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new Blob([bytes], { type: mime });
}
function setCloudStatus(text, kind = "") {
  const el = document.getElementById("cloudStatus");
  if (!el) return;
  el.textContent = text;
  el.className = "cloud-status" + (kind ? " " + kind : "");
}
async function cloudPayload() {
  const storedReceipts = await receiptAll();
  const receipts = await Promise.all(storedReceipts.map(async record => ({
    id: record.id,
    name: record.name || "receipt.jpg",
    data: await blobToDataUrl(record.blob)
  })));
  return { ...state, receipts };
}
async function applyCloudPayload(payload) {
  if (!payload || !Array.isArray(payload.entries)) throw new Error("Cloud ledger data is invalid.");
  state = {
    rate: Number(payload.rate) > 0 ? round2(payload.rate) : DEFAULT_RATE,
    bossEmail: String(payload.bossEmail || "").trim(),
    workerName: String(payload.workerName || "").trim(),
    entries: payload.entries.filter(e => e && e.id && e.date && (e.type === "hours" || e.type === "payment" || e.type === "expense"))
  };
  await receiptClear();
  cloudReceipts = new Map();
  for (const receipt of Array.isArray(payload.receipts) ? payload.receipts : []) {
    if (!receipt || !receipt.id || !receipt.data) continue;
    cloudReceipts.set(receipt.id, receipt);
    await receiptPut(receipt.id, dataUrlToBlob(receipt.data), receipt.name || "receipt.jpg");
  }
  if (!isReadOnly) localStorage.setItem(KEY, JSON.stringify(state));
}
async function cloudRequest(method, token, body) {
  const response = await fetch(CLOUD_API + "/api/ledger", {
    method,
    headers: {
      ...(token ? { Authorization: "Bearer " + token } : {}),
      ...(body ? { "Content-Type": "application/json" } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.error || "Cloud request failed.");
  return result;
}
function queueCloudSync() {
  if (!cloudReady || isReadOnly || !editorToken) return;
  clearTimeout(cloudTimer);
  setCloudStatus("Saving to cloud…");
  cloudTimer = setTimeout(async () => {
    try {
      await cloudRequest("PUT", editorToken, await cloudPayload());
      setCloudStatus("Saved to cloud", "ok");
    } catch (error) {
      setCloudStatus("Cloud save failed — local copy kept", "bad");
      console.error(error);
    }
  }, 350);
}
async function initializeCloud() {
  if (isReadOnly) {
    document.body.classList.add("read-only");
    state = blankState();
    setCloudStatus("Loading shared report…");
    const result = await cloudRequest("GET", viewerTokenFromLink);
    await applyCloudPayload(result.data);
    cloudReady = true;
    setCloudStatus("Read-only cloud report · updated " + new Date(result.updatedAt).toLocaleString("en-CA"), "ok");
    render();
    return;
  }
  if (editorTokenFromLink) {
    localStorage.setItem(CLOUD_EDITOR_KEY, editorTokenFromLink);
    editorToken = editorTokenFromLink;
  }
  if (viewerTokenFromEditorLink) localStorage.setItem(CLOUD_VIEWER_KEY, viewerTokenFromEditorLink);
  if (editorToken) {
    setCloudStatus("Loading cloud ledger…");
    const result = await cloudRequest("GET", editorToken);
    await applyCloudPayload(result.data);
    cloudReady = true;
    setCloudStatus("Saved to cloud", "ok");
    render();
    return;
  }
  setCloudStatus("Moving this phone's ledger to cloud…");
  const created = await cloudRequest("POST", "", await cloudPayload());
  editorToken = created.editorToken;
  viewerToken = created.viewerToken;
  localStorage.setItem(CLOUD_EDITOR_KEY, editorToken);
  localStorage.setItem(CLOUD_VIEWER_KEY, viewerToken);
  history.replaceState(null, "", location.pathname + location.search + "#edit=" + encodeURIComponent(editorToken) + "&share=" + encodeURIComponent(viewerToken));
  cloudReady = true;
  setCloudStatus("Saved to cloud", "ok");
}
async function compressReceipt(file) {
  if (!file || !String(file.type).startsWith("image/")) throw new Error("Pick an image file.");
  const url = URL.createObjectURL(file);
  try {
    const image = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("That receipt image could not be opened."));
      img.src = url;
    });
    const maxSide = 1400;
    const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
    return await new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Could not prepare that receipt.")), "image/jpeg", 0.78));
  } finally {
    URL.revokeObjectURL(url);
  }
}
function toISO(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function startOfWeek(iso) {
  const d = parseISO(iso);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return toISO(d);
}
function startOfMonth(iso) {
  const d = parseISO(iso);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-01";
}
function validEmail(s) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
}
function hoursLabel(n) {
  const totalMin = Math.round(Number(n) * 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (m === 0) return h + (h === 1 ? " hr" : " hrs");
  if (h === 0) return m + " min";
  return h + "h " + m + "m";
}
function buildReport(data, from, to, includePay) {
  const inRange = data.entries.filter(e => e.date >= from && e.date <= to);
  const hours = inRange.filter(e => e.type === "hours").sort(byDate);
  const pays = inRange.filter(e => e.type === "payment").sort(byDate);
  const expenses = inRange.filter(e => e.type === "expense").sort(byDate);
  const lines = [];
  lines.push(data.workerName ? data.workerName + " — hours report" : "Hours report");
  lines.push(prettyDate(from) + " to " + prettyDate(to));
  lines.push("");
  if (!hours.length) lines.push("No hours in this period.");
  else {
    hours.forEach(e => {
      let line = prettyDate(e.date) + " — " + formatHours(e) + " — " + money(earnedOf(e));
      if (e.note) line += " — " + e.note;
      lines.push(line);
    });
    const t = totals(hours);
    lines.push("");
    lines.push("Total hours: " + hoursLabel(t.hours));
    lines.push("Amount for these hours: " + money(t.earned));
  }
  if (includePay) {
    lines.push("");
    lines.push("Job expenses in this period");
    if (!expenses.length) lines.push("None");
    else expenses.forEach(e => lines.push(prettyDate(e.date) + " — " + money(expenseOf(e)) + " — " + (e.category || "Job expense") + (e.note ? " — " + e.note : "") + (e.hasReceipt ? " — receipt saved" : "")));
    lines.push("");
    lines.push("Payments in this period");
    if (!pays.length) lines.push("None");
    else pays.forEach(e => lines.push(prettyDate(e.date) + " — " + money(paidOf(e)) + (e.note ? " — " + e.note : "")));
    lines.push("");
    lines.push("Still owed overall: " + money(totals(data.entries).owing));
  }
  return lines.join("\n");
}
function byDate(a, b) {
  if (a.date === b.date) return (a.createdAt || 0) - (b.createdAt || 0);
  return a.date < b.date ? -1 : 1;
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO() {
  const n = new Date();
  return n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0") + "-" + String(n.getDate()).padStart(2, "0");
}
function parseISO(iso) {
  const [y, m, d] = String(iso).split("-").map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}
function prettyDate(iso) {
  return parseISO(iso).toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}
function money(n) {
  return new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD" }).format(round2(n));
}
function round2(n) {
  return Math.round((Number(n) + Number.EPSILON) * 100) / 100;
}
function hoursOf(entry) {
  const h = Number(entry.hours) || 0;
  const m = Number(entry.minutes) || 0;
  return h + m / 60;
}
function earnedOf(entry) {
  if (entry.type !== "hours") return 0;
  const stored = Number(entry.amount);
  if (Number.isFinite(stored) && entry.amount !== "" && entry.amount != null) return round2(stored);
  return round2(hoursOf(entry) * (Number(entry.rate) || DEFAULT_RATE));
}
function paidOf(entry) {
  return entry.type === "payment" ? round2(entry.amount || 0) : 0;
}
function expenseOf(entry) {
  return entry.type === "expense" ? round2(entry.amount || 0) : 0;
}
function totals(entries) {
  let earned = 0, expenses = 0, paid = 0, hours = 0;
  for (const e of entries) {
    earned += earnedOf(e);
    expenses += expenseOf(e);
    paid += paidOf(e);
    if (e.type === "hours") hours += hoursOf(e);
  }
  return { earned: round2(earned), expenses: round2(expenses), paid: round2(paid), owing: round2(earned + expenses - paid), hours };
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return "&#" + c.charCodeAt(0) + ";";
  });
}
function formatHours(entry) {
  const totalMin = Math.round(hoursOf(entry) * 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (m === 0) return h + (h === 1 ? " hr" : " hrs");
  if (h === 0) return m + " min";
  return h + "h " + m + "m";
}

let state = load();
if (isReadOnly) state = blankState();
let filter = "all";

function render() {
  const shownEntries = isReadOnly
    ? state.entries.filter(e => (!reportFrom || e.date >= reportFrom) && (!reportTo || e.date <= reportTo) && (reportIncludeDetails || e.type === "hours"))
    : state.entries;
  const t = totals(shownEntries);
  document.getElementById("rateLine").textContent = isReadOnly
    ? (state.workerName ? state.workerName + " · " : "") + (reportFrom && reportTo ? prettyDate(reportFrom) + " to " + prettyDate(reportTo) : "Shared hours report")
    : money(state.rate) + "/hr · cloud backup on";
  const owingEl = document.getElementById("owingAmount");
  const labelEl = document.getElementById("owingLabel");
  if (isReadOnly) labelEl.textContent = "Report balance";
  if (t.owing > 0) {
    if (!isReadOnly) labelEl.textContent = "Still owed to you";
    owingEl.textContent = money(t.owing);
  } else if (t.owing < 0) {
    if (!isReadOnly) labelEl.textContent = "Overpaid (credit)";
    owingEl.textContent = money(Math.abs(t.owing));
  } else {
    if (!isReadOnly) labelEl.textContent = "All settled";
    owingEl.textContent = money(0);
  }
  const hourLabel = (Math.round(t.hours * 100) / 100).toLocaleString("en-CA", { maximumFractionDigits: 2 });
  document.getElementById("owingSub").textContent = t.hours
    ? hourLabel + " hrs · " + money(t.expenses) + " expenses · " + money(t.paid) + " received"
    : (t.expenses ? money(t.expenses) + " in job expenses" : "Log hours at the end of a work day");
  document.getElementById("earnedStat").textContent = money(t.earned);
  document.getElementById("expenseStat").textContent = money(t.expenses);
  document.getElementById("paidStat").textContent = money(t.paid);

  const sorted = [...shownEntries].sort((a, b) => (a.date === b.date ? (a.createdAt || 0) - (b.createdAt || 0) : a.date < b.date ? -1 : 1));
  const balanceAfter = new Map();
  let run = 0;
  for (const e of sorted) {
    run = round2(run + earnedOf(e) + expenseOf(e) - paidOf(e));
    balanceAfter.set(e.id, run);
  }
  const visible = sorted.filter(e => filter === "all" || e.type === filter).reverse();
  const list = document.getElementById("list");
  if (!visible.length) {
    list.innerHTML = '<div class="empty">' + (shownEntries.length ? "Nothing in this filter." : isReadOnly ? "No activity in this report period." : "No days or payments yet. Start with the hours from the last day worked.") + "</div>";
    return;
  }
  list.innerHTML = visible.map(e => {
    const isPay = e.type === "payment";
    const isExpense = e.type === "expense";
    const main = isPay ? "Payment received" : isExpense ? (e.category || "Job expense") + (e.hasReceipt ? " · Receipt attached" : "") : formatHours(e) + " · " + money(Number(e.rate) || state.rate) + "/hr";
    const amt = isPay ? "−" + money(paidOf(e)) : isExpense ? "+" + money(expenseOf(e)) : "+" + money(earnedOf(e));
    const note = e.note ? '<div class="note">' + escapeHtml(e.note) + "</div>" : "";
    return '<button class="row" type="button" data-id="' + escapeHtml(e.id) + '">' +
      '<div class="when">' + escapeHtml(prettyDate(e.date)) + "</div>" +
      '<div class="money ' + (isPay ? "minus" : isExpense ? "expense" : "plus") + '">' + amt + "</div>" +
      '<div class="meta">' + escapeHtml(main) + "</div>" +
      '<div class="bal">Balance ' + money(balanceAfter.get(e.id) || 0) + "</div>" +
      note + "</button>";
  }).join("");
}

function rangeFor(kind) {
  const today = todayISO();
  if (kind === "week") return { from: startOfWeek(today), to: today };
  if (kind === "month") return { from: startOfMonth(today), to: today };
  const dates = state.entries.map(e => e.date).sort();
  return { from: dates[0] || today, to: today };
}

    '<button class="danger full" id="wipe" type="button">Erase the cloud ledger</button>' +
    "</div>" +
    '<p class="fine">Right now: ' + money(t.earned) + " earned, " + money(t.expenses) + " in expenses, " + money(t.paid) + " received, " + money(t.owing) + " still owed. Data and receipt photos are saved in the cloud and cached on this phone. Keep the private editing link private.</p>" +
    '<input id="importFile" class="hidden" type="file" accept="application/json,.json">'
  );
  document.getElementById("cancel").onclick = closeSheet;
  document.getElementById("saveRate").onclick = () => {
    const r = Number(document.getElementById("defaultRate").value);
    const email = document.getElementById("boss").value.trim();
    if (!(r > 0)) return alert("Rate needs to be more than zero.");
    if (email && !validEmail(email)) return alert("That boss email doesn't look right.");
    state.rate = round2(r);
    state.bossEmail = email;
    state.workerName = document.getElementById("worker").value.trim();
    save(state);
    closeSheet();
    render();
  };
  document.getElementById("exportBtn").onclick = async () => {
    try {
      const storedReceipts = await receiptAll();
      const receipts = await Promise.all(storedReceipts.map(async record => ({ id: record.id, name: record.name, data: await blobToDataUrl(record.blob) })));
      const backup = { ...state, receipts };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "owing-backup-" + todayISO() + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
    } catch {
      alert("The backup could not be created. Try again before clearing browser data.");
    }
  };
  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
  document.getElementById("copyEditLink").onclick = async () => {
    const token = viewerToken || localStorage.getItem(CLOUD_VIEWER_KEY) || "";
    const url = location.origin + location.pathname + "#edit=" + encodeURIComponent(editorToken) + (token ? "&share=" + encodeURIComponent(token) : "");
    try { await navigator.clipboard.writeText(url); alert("Private editing link copied. Anyone with this link can change the ledger."); }
    catch { alert("Could not copy automatically. Bookmark the current page instead."); }
  };
  document.getElementById("copyViewLink").onclick = async () => {
    const token = viewerToken || localStorage.getItem(CLOUD_VIEWER_KEY) || "";
    if (!token) return alert("The boss link is not available on this device. Open the original private editing link first.");
    const dates = state.entries.map(e => e.date).sort();
    const from = dates[0] || todayISO();
    const url = location.origin + location.pathname + "#view=" + encodeURIComponent(token) + "&from=" + from + "&to=" + todayISO() + "&details=1";
    try { await navigator.clipboard.writeText(url); alert("Read-only boss link copied."); }
    catch { alert("Could not copy the link automatically."); }
  };
  document.getElementById("importFile").onchange = async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    try {
      const next = JSON.parse(await file.text());
      if (!next || !Array.isArray(next.entries)) throw new Error("bad");
      if (!confirm("Replace the cloud ledger with this backup?")) return;
      state = {
        rate: Number(next.rate) > 0 ? round2(next.rate) : DEFAULT_RATE,
        bossEmail: String(next.bossEmail || "").trim(),
        workerName: String(next.workerName || "").trim(),
        entries: next.entries.filter(e => e && e.id && e.date && (e.type === "hours" || e.type === "payment" || e.type === "expense"))
      };
      await receiptClear();
      for (const record of Array.isArray(next.receipts) ? next.receipts : []) {
        if (record && record.id && record.data) await receiptPut(record.id, dataUrlToBlob(record.data), record.name || "receipt.jpg");
      }
      save(state);
      closeSheet();
      render();
    } catch {
      alert("That file isn't a usable backup.");
    }
  };
  document.getElementById("wipe").onclick = async () => {
    if (!confirm("Erase all cloud hours, expenses, payments, and receipt photos? This cannot be undone unless you have a backup.")) return;
    try { await receiptClear(); } catch {}
    state = { rate: state.rate, bossEmail: state.bossEmail || "", workerName: state.workerName || "", entries: [] };
    save(state);
    closeSheet();
    render();
  };
}

document.getElementById("addHours").onclick = () => openHours();
document.getElementById("addPay").onclick = () => openPay();
document.getElementById("addExpense").onclick = () => openExpense();
document.getElementById("emailReport").onclick = () => openEmail();
document.getElementById("settingsBtn").onclick = openSettings;
document.getElementById("filters").onclick = (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  filter = btn.dataset.filter;
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b === btn));
  render();
};
document.getElementById("list").onclick = (ev) => {
  const row = ev.target.closest("[data-id]");
  if (!row) return;
  const entry = entryById(row.dataset.id);
  if (!entry) return;
  if (isReadOnly) {
    if (entry.type === "expense" && entry.hasReceipt) openReceiptView(entry);
    return;
  }
  if (entry.type === "payment") openPay(entry);
  else if (entry.type === "expense") openExpense(entry);
  else openHours(entry);
};
render();
initializeCloud().catch(error => {
  cloudReady = false;
  setCloudStatus((isReadOnly ? "Shared report unavailable" : "Cloud unavailable — local copy kept") + ": " + (error.message || "Try again."), "bad");
  console.error(error);
});
</script>
</body>
</html>
